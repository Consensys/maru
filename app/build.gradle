import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

plugins {
  id 'maru.kotlin-application-conventions'
}

sourceSets {
  integrationTest {
    kotlin {
      compileClasspath += main.output
      runtimeClasspath += main.output
    }
    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath + sourceSets.test.compileClasspath
    runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath + sourceSets.test.runtimeClasspath
  }
}

dependencies {
  implementation(project(":api"))
  implementation(project(":config"))
  implementation(project(":consensus"))
  implementation(project(":core"))
  implementation(project(":executionlayer"))
  implementation(project(":p2p"))
  implementation(project(":storage"))
  implementation(project(":syncing"))
  implementation(project(":crypto"))
  implementation(project(":serialization"))
  implementation(project(":observability"))
  implementation(project(":syncing"))
  implementation(project(":jvm-libs:teku-web3j"))
  api(project(":linea-finalization-provider")) {
    exclude group: "build.linea", module: "besu-libs"
  }
  implementation("build.linea.internal:web3j-extensions") {
    exclude group: "build.linea", module: "besu-libs"
  }
  implementation(project(":jvm-libs:extensions"))
  implementation(project(":jvm-libs:mappers"))

  implementation "build.linea.internal:futures"
  implementation "build.linea.internal:long-running-service"

  implementation "info.picocli:picocli"
  implementation "com.sksamuel.hoplite:hoplite-core"

  implementation("org.hyperledger.besu.internal:besu-consensus-qbft-core")
  implementation("org.hyperledger.besu.internal:besu-metrics-core")
  implementation("org.hyperledger.besu.internal:besu-crypto-algorithms")
  implementation("tech.pegasys.teku.internal:p2p")
  implementation("tech.pegasys.teku.internal:eth2")
  implementation ("io.consensys.protocols:discovery")

  integrationTestRuntimeOnly("org.junit.platform:junit-platform-launcher")
  integrationTestImplementation 'org.jetbrains.kotlinx:kotlinx-datetime'
  integrationTestImplementation(project(":jvm-libs:test-utils"))
  integrationTestImplementation(testFixtures(project(":p2p")))
  integrationTestImplementation(testFixtures(project(":crypto")))
  integrationTestImplementation("org.hyperledger.besu.internal:besu-crypto-services")
  integrationTestImplementation "org.hyperledger.besu.internal:besu-ethereum-api"
  integrationTestImplementation(group: 'org.hyperledger.besu.internal', name: 'besu-ethereum-core', classifier: 'test-support')
  integrationTestImplementation("org.hyperledger.besu.internal:besu-ethereum-p2p")
  integrationTestImplementation("org.hyperledger.besu.internal:besu-consensus-qbft-core")
  integrationTestImplementation("com.squareup.okhttp3:okhttp")
  integrationTestImplementation("io.javalin:javalin")
  testImplementation(testFixtures(project(":core")))
}

// Besu and Teku have similar versioning and some modules are also named the same. This creates conflicts when
// dependencies are collected
tasks.named("distTar").configure {
  enabled = false // disable from build, not used
  duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.named("distZip").configure {
  enabled = false // disable from build, not used
  duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

application {
  mainClass = 'maru.app.CliEntrypoint'
}

jar {
  archiveBaseName = 'maru'
  manifest {
    attributes(
        'Class-Path': project.configurations.runtimeClasspath
        .collect {
          it.getName()
        }
        .findAll {
          it.endsWith('jar')
        }
        .join(' '),
        'Main-Class': 'maru.app.CliEntrypoint',
        'Multi-Release': 'true'
        )
  }
}

task integrationTest(type: Test) {
  description = "Runs integration tests."
  group = "verification"
  useJUnitPlatform()

  classpath = sourceSets.integrationTest.runtimeClasspath
  testClassesDirs = sourceSets.integrationTest.output.classesDirs

  // Run each integration test class in its own JVM fork (forkEvery = 1). Combined with
  // maxParallelForks > 1, multiple test classes execute concurrently but each in an isolated
  // JVM, so:
  //   - stdout/stderr is captured per fork and attributed to the right test class (no log bleed
  //     between sibling classes in HTML reports — the issue with the prior in-JVM
  //     parallel-classes mode);
  //   - static singletons (e.g. SignatureAlgorithmFactory, log4j context, Besu's plugin
  //     registry) don't leak between tests;
  //   - port/peer/process contention is bounded by the parallelism factor rather than the JVM
  //     thread count.
  // The default forks-per-process count is conservative: heavy integration tests spin up
  // multiple BesuCluster + MaruApp instances each, so we cap at availableProcessors / 4 (with
  // a minimum of 2 so we still get some parallelism even on tiny runners). Override locally
  // with `-Dmaru.integrationTest.maxParallelForks=N` if you want to tune.
  forkEvery = 1
  def maxForksOverride = System.getProperty("maru.integrationTest.maxParallelForks")
  maxParallelForks = (maxForksOverride != null)
      ? maxForksOverride.toInteger()
      : Math.max(2, Runtime.runtime.availableProcessors().intdiv(2))

  // Within a single class methods run sequentially (each class is already in its own JVM, so
  // we don't need additional intra-class parallelism — and many of our test classes share
  // mutable state across @Test methods).
  systemProperties["junit.jupiter.execution.parallel.mode.classes.default"] = "same_thread"
  systemProperties["junit.jupiter.execution.parallel.mode.default"] = "same_thread"
  // Limit JUnit's parallel pool to 1 to make the same_thread setting unambiguous on JVMs that
  // may otherwise pre-allocate workers from the parallel pool.
  systemProperties["junit.jupiter.execution.parallel.config.strategy"] = "fixed"
  systemProperties["junit.jupiter.execution.parallel.config.fixed.max-pool-size"] = 1
  systemProperties["junit.jupiter.execution.parallel.config.fixed.parallelism"] = 1

  testLogging {
    events TestLogEvent.FAILED,
        TestLogEvent.SKIPPED,
        TestLogEvent.STANDARD_ERROR
    // TestLogEvent.STARTED,
    // TestLogEvent.PASSED
    exceptionFormat TestExceptionFormat.FULL
    showCauses true
    showExceptions true
    showStackTraces true
    // set showStandardStreams if you need to see test logs
    showStandardStreams false
  }
}

afterEvaluate {
  // Integration tests are getting unstable when running concurrently with other tests
  tasks.named('integrationTest') {
    mustRunAfter rootProject.subprojects.collect {
      it.tasks.matching {
        it.name == 'test'
      }
    }.flatten()
  }
}

check.dependsOn(integrationTest)
